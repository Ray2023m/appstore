services:
  linkding:
    container_name: ${CONTAINER_NAME}
    image: woohoodai/linkding-cn:v1.4.0
    restart: always
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:9090"
    volumes:
      - "./data:/etc/linkding/data"
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - LD_SUPERUSER_NAME=${LD_SUPERUSER_NAME}
      - LD_SUPERUSER_PASSWORD=${LD_SUPERUSER_PASSWORD}
      - LD_BROWSER_ENGINE=chromium
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - PYTHONIOENCODING=utf-8
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true
